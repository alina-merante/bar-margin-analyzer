name: Clean Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/verify-clean-bootstrap.sh"
      - "docker-compose.yml"
      - "docker-compose.clean-bootstrap.yml"
      - ".github/workflows/clean-bootstrap.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/verify-clean-bootstrap.sh"
      - "docker-compose.yml"
      - "docker-compose.clean-bootstrap.yml"
      - ".github/workflows/clean-bootstrap.yml"

permissions:
  contents: read

jobs:
  clean-bootstrap:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/bar_margin_analyzer

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bar_margin_analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bar_margin_analyzer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Verify PostgreSQL starts empty
        run: |
          python - <<'PY'
          import os

          import psycopg2

          database_url = os.environ["DATABASE_URL"].replace(
              "postgresql+psycopg2://", "postgresql://", 1
          )
          with psycopg2.connect(database_url) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT tablename FROM pg_tables "
                      "WHERE schemaname = 'public' ORDER BY tablename"
                  )
                  tables = [row[0] for row in cursor.fetchall()]

          if tables:
              raise SystemExit(f"Expected an empty public schema, found: {tables}")
          print("PostgreSQL clean schema: PASS")
          PY

      - name: Apply Alembic migrations from base
        working-directory: backend
        run: alembic upgrade head

      - name: Verify Alembic revision and schema
        working-directory: backend
        run: |
          alembic current | grep -F "20261013_0004 (head)"
          python - <<'PY'
          import os

          import psycopg2

          expected_tables = [
              "category_rules",
              "daily_cash_closures",
              "documents",
              "expense_categories",
              "invoice_payment_links",
              "invoices",
              "payments",
              "products",
              "sale_lines",
              "transactions",
          ]
          database_url = os.environ["DATABASE_URL"].replace(
              "postgresql+psycopg2://", "postgresql://", 1
          )
          with psycopg2.connect(database_url) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT version_num FROM alembic_version")
                  revision = cursor.fetchone()[0]
                  cursor.execute(
                      "SELECT tablename FROM pg_tables "
                      "WHERE schemaname = 'public' AND tablename <> 'alembic_version' "
                      "ORDER BY tablename"
                  )
                  tables = [row[0] for row in cursor.fetchall()]
                  cursor.execute(
                      "SELECT 1 FROM information_schema.columns "
                      "WHERE table_schema = 'public' "
                      "AND table_name = 'invoices' AND column_name = 'file_url'"
                  )
                  file_url_exists = cursor.fetchone() is not None

          if revision != "20261013_0004":
              raise SystemExit(f"Unexpected Alembic revision: {revision}")
          if tables != expected_tables:
              raise SystemExit(
                  f"Unexpected tables: expected {expected_tables}, got {tables}"
              )
          if not file_url_exists:
              raise SystemExit("Missing invoices.file_url")
          print("Alembic revision, 10 tables, and invoices.file_url: PASS")
          PY

      - name: Start API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > ../api.log 2>&1 &
          echo $! > ../api.pid

      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1

      - name: Verify dashboard API endpoints repeatedly
        run: |
          python - <<'PY'
          import urllib.request

          paths = [
              "/health",
              "/invoices",
              "/categories",
              "/documents",
              "/analytics/overview?month=2026-09",
              "/analytics/pnl/trend?months=2&month=2026-09",
              "/analytics/top-products?month=2026-09",
              "/analytics/insights?month=2026-09",
          ]

          for request_round in range(1, 4):
              for path in paths:
                  with urllib.request.urlopen(
                      f"http://127.0.0.1:8000{path}", timeout=10
                  ) as response:
                      if response.status != 200:
                          raise SystemExit(
                              f"Round {request_round}: {path}: HTTP {response.status}"
                          )
                  print(f"Round {request_round}: {path}: HTTP 200")
          PY

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Show API log on failure
        if: failure()
        run: cat api.log || true